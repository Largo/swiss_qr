# Publishes the gem to RubyGems.org with trusted publishing (OIDC, no API key)
# when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0   (the tag must equal SwissQr::VERSION)
#
# The gem carries a Sigstore attestation, so RubyGems.org shows which
# repository, workflow and commit built it. RubyGems.org must know this
# workflow as a trusted publisher: owner "Largo", repository "swiss_qr",
# workflow "release.yml", environment "release".
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC token: RubyGems API key and Sigstore signing identity
      attestations: write # GitHub build provenance (actions/attest)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Check that the tag matches SwissQr::VERSION
        run: |
          version=$(ruby -Ilib -e 'require "swiss_qr/version"; print SwissQr::VERSION')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Run tests and RuboCop
        run: bundle exec rake
      - name: Build the gem
        run: |
          bundle exec rake build
          ls -l pkg
      # Signed build provenance on GitHub, before anything is published; check
      # a downloaded gem with
      #   gh attestation verify swiss_qr-<version>.gem -R Largo/swiss_qr
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "pkg/*.gem"
      # The attestation above stays on GitHub; RubyGems.org shows a gem as
      # built and signed on GitHub Actions only when it is pushed with a
      # Sigstore bundle for it (RubyGems 4.0 does not sign by itself). Signed
      # with this workflow's identity, as rubygems/release-gem does; a failure
      # stops the release instead of pushing an unsigned gem.
      - name: Sign the gem (Sigstore attestation)
        run: |
          for gem in pkg/*.gem; do
            gem exec sigstore-cli:0.2.3 sign "$gem" --bundle "$gem.sigstore.json"
          done
      # Exchanges the workflow's OIDC token for a short-lived RubyGems API key.
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push the gem with its attestation
        run: |
          gem="pkg/swiss_qr-${GITHUB_REF_NAME#v}.gem"
          gem push "$gem" --attestation "$gem.sigstore.json"
